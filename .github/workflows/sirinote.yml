name: Add Note via Siri
on:
  repository_dispatch:
    types: [siri_add_note]
permissions:
  contents: write
jobs:
  add-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject Note into tasks.json
        run: |
          node -e "
            const fs = require('fs');
            const title = process.env.NOTE_TITLE;
            const body = process.env.NOTE_BODY;
            if (!title) process.exit(0);

            const file = 'tasks.json';
            let data = { tasks: [], cnNotes: [] };
            if (fs.existsSync(file)) {
              data = JSON.parse(fs.readFileSync(file, 'utf8'));
            }
            if (!Array.isArray(data.cnNotes)) data.cnNotes = [];

            const uid = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
            const now = new Date().toISOString();
            const newNote = {
              id: uid,
              title: title,
              speaker: '',
              body: body || '',
              tags: [],
              projectId: '',
              bodyIsMono: false,
              pinned: false,
              createdAt: now,
              updatedAt: now
            };

            data.cnNotes.unshift(newNote);
            fs.writeFileSync(file, JSON.stringify(data, null, 2));
          "
        env:
          NOTE_TITLE: \${{ github.event.client_payload.title }}
          NOTE_BODY: \${{ github.event.client_payload.body }}

      - name: Commit and Push
        run: |
          git config user.name "Siri Bot"
          git config user.email "siri@taskmanager.local"
          git add tasks.json
          git commit -m "Siri Added Note: \${{ github.event.client_payload.title }}"
          git push
