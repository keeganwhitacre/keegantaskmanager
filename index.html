<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Life Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f5f7;
  --card: rgba(255,255,255,0.75);
  --border: rgba(0,0,0,0.08);
  --text: #1d1d1f;
  --subtle: #6e6e73;
  --accent: #0071e3;
  --radius: 22px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --card: rgba(28,28,30,0.75);
    --border: rgba(255,255,255,0.08);
    --text: #f5f5f7;
    --subtle: #8e8e93;
    --accent: #0a84ff;
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  transition: background 0.3s ease, color 0.3s ease;
}

header {
  padding: 28px 20px 12px;
  font-size: 30px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header button {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px 12px;
  color: var(--text);
  cursor: pointer;
}

.container {
  padding: 16px;
  display: grid;
  gap: 18px;
  max-width: 1000px;
  margin: 0 auto;
}

.card {
  background: var(--card);
  backdrop-filter: blur(24px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.card.hidden {
  opacity: 0;
  transform: scale(0.98);
  pointer-events: none;
  height: 0;
  overflow: hidden;
  padding: 0;
  margin: 0;
}

.card h2 {
  margin: 0 0 14px;
  font-size: 18px;
  font-weight: 600;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0 0 12px;
}

li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 4px;
  border-radius: 10px;
  transition: background 0.2s ease;
}

li.dragging {
  opacity: 0.5;
}

li:hover {
  background: rgba(0,0,0,0.04);
}

input[type="checkbox"] {
  accent-color: var(--accent);
  width: 18px;
  height: 18px;
}

input[type="text"], textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 12px;
  font-size: 14px;
  font-family: inherit;
  background: rgba(255,255,255,0.9);
  transition: border 0.2s ease, box-shadow 0.2s ease;
}

@media (prefers-color-scheme: dark) {
  input[type="text"], textarea {
    background: rgba(44,44,46,0.9);
  }
}

input[type="text"]:focus, textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(0,113,227,0.15);
}

button.add {
  margin-top: 8px;
  background: var(--accent);
  border: none;
  color: white;
  padding: 8px 14px;
  border-radius: 14px;
  font-weight: 500;
  cursor: pointer;
}

textarea { resize: none; }

@media(min-width: 768px) {
  .container {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>
<body>

<header>
  Life Dashboard
  <button onclick="toggleFocusMode()">Focus Mode</button>
</header>

<div class="container">

<div class="card" id="todayCard">
<h2>Today</h2>
<ul id="todayList"></ul>
<input type="text" id="todayInput" placeholder="Add task" />
<button class="add" onclick="addItem('today')">Add</button>
</div>

<div class="card" id="workingCard">
<h2>Working On</h2>
<ul id="workingList"></ul>
<input type="text" id="workingInput" placeholder="Add focus" />
<button class="add" onclick="addItem('working')">Add</button>
</div>

<div class="card" id="notesCard">
<h2>Notes</h2>
<textarea id="notes" rows="6" placeholder="Quick thoughts..."></textarea>
</div>

</div>

<script>
let focusMode = false;

function toggleFocusMode() {
  focusMode = !focusMode;
  document.getElementById('todayCard').classList.toggle('hidden', focusMode);
  document.getElementById('notesCard').classList.toggle('hidden', focusMode);
}

function addItem(type) {
  const input = document.getElementById(type + 'Input');
  if (!input.value.trim()) return;

  const li = createListItem(input.value, false);
  document.getElementById(type + 'List').appendChild(li);
  input.value = '';
  saveData();
}

function createListItem(text, checked) {
  const li = document.createElement('li');
  li.draggable = true;

  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.checked = checked;

  const span = document.createElement('span');
  span.textContent = text;

  li.appendChild(checkbox);
  li.appendChild(span);

  li.addEventListener('dragstart', () => li.classList.add('dragging'));
  li.addEventListener('dragend', () => {
    li.classList.remove('dragging');
    saveData();
  });

  return li;
}

function enableDragAndDrop(listId) {
  const list = document.getElementById(listId);
  list.addEventListener('dragover', e => {
    e.preventDefault();
    const dragging = document.querySelector('.dragging');
    const afterElement = getDragAfterElement(list, e.clientY);
    if (afterElement == null) {
      list.appendChild(dragging);
    } else {
      list.insertBefore(dragging, afterElement);
    }
  });
}

function getDragAfterElement(container, y) {
  const elements = [...container.querySelectorAll('li:not(.dragging)')];
  return elements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function saveData() {
  const data = {
    today: getList('todayList'),
    working: getList('workingList'),
    notes: document.getElementById('notes').value
  };
  localStorage.setItem('lifeDashboard', JSON.stringify(data));
}

function getList(id) {
  return Array.from(document.getElementById(id).children).map(li => ({
    text: li.querySelector('span').textContent,
    checked: li.querySelector('input').checked
  }));
}

function loadData() {
  const saved = JSON.parse(localStorage.getItem('lifeDashboard'));
  if (!saved) return;

  ['today','working'].forEach(type => {
    saved[type]?.forEach(item => {
      const li = createListItem(item.text, item.checked);
      document.getElementById(type + 'List').appendChild(li);
    });
  });

  document.getElementById('notes').value = saved.notes || '';
}

window.onload = () => {
  loadData();
  enableDragAndDrop('todayList');
  enableDragAndDrop('workingList');
};

document.addEventListener('change', saveData);
document.getElementById('notes').addEventListener('input', saveData);
</script>

</body>
</html>
